<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframev2 Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Главный контейнер -->
    <div id="iframe-container" class="iframe-container">
        
        <!-- Лоадер/Заставка на время загрузки сайта -->
        <div id="loader" class="loader">Загрузка контента...</div>

        <!-- Сам iframe для отображения сайта/приложения -->
        <iframe id="target-iframe" src="" frameborder="0" allowfullscreen allow="geolocation; microphone; camera; midi; encrypted-media;"></iframe>
        
        <!-- Кастомный GUI-интерфейс (скроется при nocontrols или disableiframegui) -->
        <div id="gui-controls" class="gui-controls">
            <button onclick="location.reload()">Обновить</button>
            <span id="status-badge" class="badge">Режим просмотра</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
