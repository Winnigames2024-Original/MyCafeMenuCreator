<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="iframe-container" class="iframe-container">
        <!-- Лоадер -->
        <div id="loader" class="loader">Загрузка...</div>

        <!-- Панель ошибки (скрыта по умолчанию) -->
        <div id="error-notice" class="error-notice hidden">
            <h3>⚠️ Контент не отображается</h3>
            <p id="error-message">Причина неизвестна.</p>
            <!-- Кнопка перехода -->
            <a id="bypass-link" href="#" class="error-btn" target="_blank" rel="noopener noreferrer">Открыть сайт в новой вкладке</a>
        </div>

        <!-- Сам iframe -->
        <iframe id="target-iframe" src="" frameborder="0"></iframe>
    </div>

    <!-- Скрипт -->
    <script src="script.js"></script>
</body>
</html>
