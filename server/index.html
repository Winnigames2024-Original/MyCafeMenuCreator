<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>README — My Cafe Menu Creator</title>

<!-- Только ОДНА внешняя библиотека: конвертер Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Подсветка синтаксиса (подключаем с defer, в коде есть проверка на существование) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --secondary: #8b949e;
    --border: #30363d;
    --accent: #58a6ff;
    --code-bg: #161b22;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 32px 16px;
  }
  .container { max-width: 900px; margin: 0 auto; }

  h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    margin: 24px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  h1 { font-size: 2em; }
  h2 { font-size: 1.5em; }
  h3 { font-size: 1.25em; }
  h1 a.anchor, h2 a.anchor, h3 a.anchor, h4 a.anchor, h5 a.anchor, h6 a.anchor {
    opacity: 0; margin-left: 8px; text-decoration: none; color: var(--secondary);
    transition: opacity .2s;
  }
  h1:hover a.anchor, h2:hover a.anchor, h3:hover a.anchor,
  h4:hover a.anchor, h5:hover a.anchor, h6:hover a.anchor { opacity: 1; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  p { margin: 0 0 16px; }
  ul, ol { margin: 0 0 16px; padding-left: 2em; }
  blockquote {
    margin: 0 0 16px; padding: 0 1em;
    border-left: 4px solid var(--border); color: var(--secondary);
  }
  table { border-collapse: collapse; margin: 0 0 16px; display: block; overflow-x: auto; max-width: 100%; }
  th, td { border: 1px solid var(--border); padding: 6px 13px; }
  th { background: var(--panel); }
  tr:nth-child(2n) td { background: #10141a; }
  img { max-width: 100%; }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    margin: 0 0 16px;
    position: relative;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, Menlo, monospace;
    font-size: 85%;
  }
  p code, li code {
    background: rgba(110,118,129,.4);
    padding: .2em .4em; border-radius: 6px;
  }
  pre code { background: transparent; padding: 0; display: block; }

  /* Кнопка Copy — своя, без плагинов Prism */
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: #21262d; border: 1px solid var(--border);
    color: var(--secondary);
    font-size: 12px; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; opacity: 0; transition: opacity .2s, background .2s;
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: #30363d; color: var(--text); }
  .copy-btn.copied { color: #3fb950; border-color: #3fb950; opacity: 1; }

  .status {
    text-align: center; padding: 60px 20px; color: var(--secondary);
  }
  .status.error {
    color: #f85149;
    background: rgba(248,81,73,.1);
    border: 1px solid rgba(248,81,73,.4);
    border-radius: 6px;
  }
  hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <div id="content" class="status">Загрузка README…</div>
</div>

<script>
const BASE = 'https://raw.githubusercontent.com/Winnigames2024-Original/MyCafeMenuCreator/main/server/';
const VARIANTS = ['README.MD', 'README.md', 'readme.MD', 'readme.md'];
let attempt = 0;

function tryLoad() {
  if (attempt >= VARIANTS.length) {
    fail('README не найден ни в одном варианте имени.');
    return;
  }
  const name = VARIANTS[attempt];
  const url = BASE + name;
  document.getElementById('content').textContent = 'Пробую: ' + name + '…';

  fetch(url)
    .then(r => {
      if (!r.ok) { attempt++; tryLoad(); return null; }
      return r.text();
    })
    .then(text => {
      if (text === null) return;
      render(text);
    })
    .catch(() => { attempt++; tryLoad(); });
}

function render(md) {
  // Настройка marked (работает и со старыми, и с новыми версиями)
  if (marked.setOptions) {
    marked.setOptions({ breaks: false, gfm: true });
  }
  const html = marked.parse ? marked.parse(md) : marked(md);

  const el = document.getElementById('content');
  el.className = '';
  el.innerHTML = html;

  addAnchors(el);
  addCopyButtons(el);
  highlight(el);
}

function addAnchors(root) {
  root.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
    const id = h.textContent.toLowerCase().trim()
      .replace(/[^\wа-яё\- ]+/gi, '')
      .replace(/\s+/g, '-');
    h.id = id || h.tagName;
    const a = document.createElement('a');
    a.className = 'anchor';
    a.href = '#' + h.id;
    a.setAttribute('aria-label', 'Ссылка на заголовок');
    a.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M7.775 3.275l1.25-1.25a3.5 3.5 0 114.95 4.95l-2.5 2.5a3.5 3.5 0 01-4.95 0 .75.75 0 01.018-1.042.75.75 0 011.042-.018 1.998 1.998 0 002.83 0l2.5-2.5a2 2 0 00-2.83-2.83l-1.25 1.25a.75.75 0 01-1.06-1.06zm-4.69 9.64a1.998 1.998 0 002.83 0l1.25-1.25a.75.75 0 011.06 1.06l-1.25 1.25a3.5 3.5 0 11-4.95-4.95l2.5-2.5a3.5 3.5 0 014.95 0 .75.75 0 01-.018 1.042.75.75 0 01-1.042.018 2 2 0 00-2.83 0l-2.5 2.5a2 2 0 000 2.83z"/></svg>';
    h.appendChild(a);
  });
}

function addCopyButtons(root) {
  root.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText)
        .then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });
    });
    pre.appendChild(btn);
  });
}

function highlight(root) {
  // Защита: подсветка сработает, только если highlight.js успел загрузиться
  function run() {
    if (window.hljs && hljs.highlightAll) {
      root.querySelectorAll('pre code').forEach(block => {
        block.classList.add('hljs');
        try { hljs.highlightElement(block); } catch (e) {}
      });
    }
  }
  if (window.hljs) { run(); }
  else { window.addEventListener('load', run); }
}

function fail(msg) {
  const el = document.getElementById('content');
  el.className = 'status error';
  el.innerHTML = '<strong>Ошибка:</strong> ' + msg +
    '<br>Проверь, что файл лежит в папке server/ репозитория.';
}

tryLoad();
</script>
</body>
</html>
