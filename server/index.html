<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>README Viewer</title>

    <!-- 1. Конвертер Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 2. Prism.js (Актуальная версия) -->
    <!-- Базовая тема -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/themes/prism-tomorrow.min.css">
    
    <!-- Ядра и плагины (строго в этом порядке!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/prism.min.js"></script>
    <!-- Плагин копирования (в новых версиях не требует Toolbar) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Подключаем языки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/components/prism-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.31.0/components/prism-javascript.min.js"></script>

    <style>
        :root {
            --bg: #161b22;
            --text: #cdd6f4;
            --secondary: #a6adc8;
            --border: #313244;
            --accent: #58a6ff;
            --code-bg: #0d1117;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-code: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Заголовки и якоря */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text);
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 12px;
            position: relative;
        }

        h1 a, h2 a, h3 a, h4 a, h5 a, h6 a {
            opacity: 0;
            text-decoration: none;
            color: var(--secondary);
            margin-left: 8px;
            transition: opacity 0.2s;
        }

        h1:hover a, h2:hover a, h3:hover a, h4:hover a, h5:hover a, h6:hover a {
            opacity: 1;
        }

        a { color: var(--accent); text-decoration: underline; }
        p { margin-bottom: 16px; }
        ul, ol { margin-bottom: 16px; padding-left: 24px; }
        li { margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        th { background: var(--code-bg); color: var(--secondary); }
        img { max-width: 100%; border-radius: 6px; }

        /* Стили кода */
        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
            position: relative; /* Важно для позиционирования кнопки */
        }
        code { font-family: var(--font-code); }

        /* Кнопка Copy (переопределяем стили плагина под темную тему) */
        button.copy-code-button {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(21, 25, 34, 0.9);
            border: 1px solid var(--border);
            color: var(--secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
            transition: all 0.2s;
        }
        button.copy-code-button:hover {
            background: #313244;
            color: var(--accent);
            border-color: var(--accent);
        }

        .loading, .error {
            text-align: center;
            padding: 60px;
            color: var(--secondary);
        }
        .error { 
            color: #ff7b72; 
            background: #2e1e2e; 
            border: 1px solid #ff7b72; 
            border-radius: 6px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content" class="loading">Поиск README...</div>
    </div>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/Winnigames2024-Original/MyCafeMenuCreator/main/server/';
        
        // Варианты регистра
        const variants = ['README.MD', 'README.md', 'readme.MD', 'readme.md'];
        let attempt = 0;

        function tryLoadNext() {
            if (attempt >= variants.length) {
                showError('Файл README не найден ни в одном из вариантов написания.');
                return;
            }

            const currentFile = variants[attempt];
            const url = baseUrl + currentFile;
            
            // Обновляем текст загрузки
            document.getElementById('content').innerText = `Пробую: ${currentFile}...`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        attempt++;
                        tryLoadNext();
                        return;
                    }
                    return response.text();
                })
                .then(text => {
                    const html = marked.parse(text);
                    document.getElementById('content').innerHTML = html;

                    addAnchors();
                    
                    // ВАЖНО: Вызываем highlightAll только после вставки HTML
                    setTimeout(() => {
                        Prism.highlightAll();
                    }, 100);
                })
                .catch(err => {
                    console.error(err);
                    attempt++;
                    tryLoadNext();
                });
        }

        function addAnchors() {
            const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
            headings.forEach(heading => {
                const id = heading.innerText.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                heading.id = id;

                const anchor = document.createElement('a');
                anchor.href = '#' + id;
                anchor.setAttribute('aria-label', 'Permalink');
                anchor.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.97 3.97a3.75 3.75 0 015.3 0l2.5 2.5a3.75 3.75 0 010 5.3l-2.5 2.5a3.75 3.75 0 01-5.3 0l-2.5-2.5a3.75 3.75 0 010-5.3l2.5-2.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                `;
                heading.appendChild(anchor);
            });
        }

        function showError(msg) {
            const el = document.getElementById('content');
            el.className = 'error';
            el.innerHTML = `<strong>Ошибка:</strong> ${msg}<br><br>Проверь путь к файлу в репозитории.`;
        }

        tryLoadNext();
    </script>
</body>
</html>
